name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Serialize releases so two different versions cannot race to update npm's latest tag.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate release
    if: github.repository == 'Ryhus/anki-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Pin npm for reproducible archives
        run: npm install --global npm@12.0.1 --ignore-scripts

      - name: Require a matching stable tag on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/release.ts validate "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Set up MCP publisher
        uses: ./.github/actions/setup-mcp-publisher

      - name: Validate MCP Registry schema
        run: mcp-publisher validate server.json

      - name: Pack the tested release
        run: node scripts/release.ts pack "$RUNNER_TEMP/anki-mcp-package"

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/anki-mcp-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    name: Publish to npm and MCP Registry
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm for trusted publishing
        run: npm install --global npm@12.0.1 --ignore-scripts

      - name: Download tested archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/anki-mcp-package

      - name: Set up MCP publisher
        uses: ./.github/actions/setup-mcp-publisher

      - name: Validate release metadata
        run: |
          node scripts/release.ts validate "$GITHUB_REF_NAME"
          mcp-publisher validate server.json

      - name: Check existing publications before writing
        id: registry
        run: node scripts/release.ts preflight "$RUNNER_TEMP/anki-mcp-package"

      - name: Publish tested archive to npm with OIDC
        if: steps.registry.outputs.npm_exists == 'false'
        run: >-
          npm publish "$RUNNER_TEMP/anki-mcp-package/package.tgz"
          --access public --tag latest --ignore-scripts
          --fetch-retries=0 --fetch-timeout=30000

      - name: Verify anonymous npm download and metadata
        run: node scripts/release.ts verify-npm "$RUNNER_TEMP/anki-mcp-package"

      - name: Authenticate to MCP Registry with OIDC
        if: steps.registry.outputs.mcp_exists == 'false'
        run: mcp-publisher login github-oidc

      - name: Publish metadata to MCP Registry
        if: steps.registry.outputs.mcp_exists == 'false'
        run: mcp-publisher publish

      - name: Verify MCP Registry publication
        run: node scripts/release.ts verify-mcp
